default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  - repo: local
    hooks:
      - id: no-npm-lockfiles
        name: No npm lockfiles (this project uses yarn)
        entry: This project uses Yarn 1 - commit yarn.lock, never package-lock.json
        language: fail
        files: (^|/)(package-lock\.json|npm-shrinkwrap\.json)$

      - id: type-check
        name: TypeScript type check
        entry: yarn type-check
        language: system
        types: [ts]
        pass_filenames: false
      - id: lint
        name: Biome lint
        entry: yarn lint
        language: system
        types: [ts]
        pass_filenames: false
