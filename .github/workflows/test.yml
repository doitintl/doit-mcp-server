name: Test on Pull Request

on:
  pull_request:
    branches:
      - "**"

# Both suites run on every supported Node major: 20 is the `engines` floor, 22 is
# what volta pins and what release.yml publishes from. Keep the two matrices in
# sync, and update them together with `engines.node` in package.json.
#
# fail-fast is off so a version-specific failure shows up as exactly that, rather
# than cancelling its sibling and leaving it ambiguous which version broke.
jobs:
  lint-test-build:
    name: Tests and Build - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This project is Yarn 1 (see the packageManager/volta pins). A committed
      # npm lockfile means someone ran `npm install`, which silently diverges from
      # yarn.lock. `|| true` keeps a no-match grep from failing the step.
      - name: Enforce yarn (no npm lockfiles committed)
        run: |
          found="$(git ls-files | grep -E '(^|/)(package-lock\.json|npm-shrinkwrap\.json)$' || true)"
          if [ -n "$found" ]; then
            echo "::error::This project uses Yarn 1 - remove the npm lockfile(s): $found"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint and format checks
        run: yarn check:ci

      - name: Run unit tests
        run: yarn test

      - name: Build
        run: yarn build

  integration-tests:
    name: Integration Tests - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install integration test dependencies
        run: yarn install --frozen-lockfile
        working-directory: test/integration

      - name: Run integration tests
        run: yarn test
        working-directory: test/integration
