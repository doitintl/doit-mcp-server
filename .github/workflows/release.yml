name: Release

on:
  push:
    tags:
      - "v[0-9]*"

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate semver tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a valid semver tag (expected vX.Y.Z)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          chmod +x scripts/release/extract-changelog.sh
          ./scripts/release/extract-changelog.sh --tag "$GITHUB_REF_NAME" > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md

  # Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret involved.
  # One-time setup: a package maintainer adds a GitHub Actions trusted publisher
  # (repo doitintl/doit-mcp-server, workflow release.yml) in the package's
  # settings on npmjs.com. See docs/release.md.
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Pinned to major 11 because
      # npm@latest can require a newer Node than this job runs (npm@12 needs
      # Node >= 22.22, which broke the first publish attempt on Node 20).
      - name: Update npm
        run: npm install -g npm@11

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$PKG_VERSION' — run scripts/release/prepare-release.sh before tagging"
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: yarn test

      - name: Build
        run: yarn build

      - name: Publish
        run: npm publish --access public
