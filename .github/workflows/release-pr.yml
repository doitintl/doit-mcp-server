name: Release PR

# Keeps a "chore: prepare release vX.Y.Z" pull request open against main for as
# long as there are unreleased commits. The PR carries exactly what
# scripts/release/prepare-release.sh would produce locally: the version bumps
# and the drafted CHANGELOG entry. Merging it is the human gate — the Release
# workflow then tags the merge commit and publishes. See docs/release.md.
#
# The PR is rebuilt from main on every push, so the proposed version and the
# changelog always reflect everything merged so far.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    name: Open or update the release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # prepare-release.sh reads tags and the full commit history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine next version
        id: version
        run: |
          TAG="$(./scripts/release/next-version.sh HEAD)"
          if [ -z "$TAG" ]; then
            echo "Nothing to release."
          else
            echo "Next release: ${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.version.outputs.tag != ''
        run: yarn install --frozen-lockfile

      - name: Prepare the release
        if: steps.version.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: ./scripts/release/prepare-release.sh --tag "$RELEASE_TAG" --yes

      # Pull requests opened by GITHUB_TOKEN do not trigger the Test workflow,
      # so the same checks run here before the PR is opened.
      - name: Validate the prepared release (lint, tests, build)
        if: steps.version.outputs.tag != ''
        run: |
          yarn check:ci
          yarn test
          yarn build

      - name: Create or update pull request
        if: steps.version.outputs.tag != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/release
          title: "chore: prepare release ${{ steps.version.outputs.tag }}"
          commit-message: "chore: prepare release ${{ steps.version.outputs.tag }}"
          body: |
            Prepares **${{ steps.version.outputs.tag }}**: version bumps and the drafted
            `CHANGELOG.md` entry, generated by `scripts/release/prepare-release.sh`.

            Review the changelog entry and edit it on this branch if needed — the
            entry is what becomes the GitHub Release notes. Merging this PR makes
            the [Release workflow](../blob/main/.github/workflows/release.yml) tag
            the merge commit, create the GitHub Release, and publish to npm.

            This PR is regenerated from `main` on every push, so any hand-edits to
            the changelog are overwritten when new commits land. Edit it last, or
            fix up the entry after the release.
          labels: automated,release
          delete-branch: true
